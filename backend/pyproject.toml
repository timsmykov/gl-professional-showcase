[project]
name = "gl-professional-telegram-bot"
version = "0.2.0"
description = "Telegram bot for G&L Professional"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.28,<4",
  "aiohttp>=3.10,<4",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "uvicorn>=0.34,<1",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "aiohttp-socks>=0.11,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "httpx>=0.28,<1",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gl_bot", "gl_api"]

[tool.ruff]
target-version = "py312"
line-length = 99
